# ─── docker-compose.yml ── Production / Staging ───────────────────────────────
# Usage:
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up -d
#
# The frontend (Vite/React) is deployed separately to Vercel — it is not
# included here. Only the Backend API + PostgreSQL run in Docker.

name: arbeitszeit-pro

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-arbeitszeit_pro}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}    # required — no default
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-arbeitszeit_pro}"]
      interval:     10s
      timeout:       5s
      start_period: 10s
      retries:       5
    # Do NOT expose port 5432 in production — only the backend needs it
    networks:
      - internal

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
      target:     runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:               production
      PORT:                   3000
      DATABASE_URL:           postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arbeitszeit_pro}
      FRONTEND_URL:           ${FRONTEND_URL}
      JWT_SECRET:             ${JWT_SECRET}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET}
      SMTP_HOST:              ${SMTP_HOST}
      SMTP_PORT:              ${SMTP_PORT:-587}
      SMTP_USER:              ${SMTP_USER}
      SMTP_PASS:              ${SMTP_PASS}
      SMTP_FROM:              ${SMTP_FROM}
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY}
      STRIPE_PRICE_ID:        ${STRIPE_PRICE_ID}
      STRIPE_PRICE_ID_MONTHLY: ${STRIPE_PRICE_ID_MONTHLY}
      STRIPE_PRICE_ID_YEARLY:  ${STRIPE_PRICE_ID_YEARLY}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - internal
      - external
    healthcheck:
      test:         ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval:     30s
      timeout:      10s
      start_period: 30s
      retries:       3

networks:
  internal:   # postgres ↔ backend only
  external:   # backend exposed to internet

volumes:
  postgres_data:
    driver: local
